services:
  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-3306}
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      - DB_NAME=${DB_NAME:-lms}
      - DB_USER=${DB_USER:-lms_app}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - TZ=${TZ:-Asia/Ulaanbaatar}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    restart: unless-stopped
    networks:
      - internal
  
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${DB_NAME:-lms}
      MARIADB_USER: ${DB_USER:-lms_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: ${TZ:-Asia/Ulaanbaatar}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --max-connections=100
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/slow.log
      --long-query-time=1
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - internal
  
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 3600 1
      --save 300 100
      --save 60 10000
      --loglevel notice
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  mariadb-data:

networks:
  internal:
    driver: bridge